# /etc/nginx/conf.d/pda.conf
# HB-PDA 网页版，独立站点，监听 8087
#
# ⚠️ 本文件是**新增**的独立配置，安装时只往 conf.d/ 里放这一个文件。
#    绝不修改/删除 /etc/nginx/sites-enabled/* —— 同机 RCS 的反代配置在那里，
#    删掉会导致 RCS 网页打不开。
#    也不使用 default_server，避免与现有 80/443 站点冲突。
#
# 端口占用参考：RCS 80/443/3000~3006/9091；WCS 8085(后端)/8086(前端)；本 PDA 8087
server {
    listen 8087;
    server_name _;

    # PDA 网页版静态文件（deploy.sh 会拷到 /opt/pda/dist）
    root /opt/pda/dist;
    index index.html;

    # PDA 上传照片/单据等，放开请求体
    client_max_body_size 100m;

    # ⚠️ index.html 必须不缓存：它里面引用的是带内容 hash 的 app.<hash>.js。
    #    若被客户端启发式缓存，发新包后 PDA 仍会加载【旧 hash】的 js —— 表现就是"改了却完全没变化"。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 带内容 hash 的静态资源可放心长缓存（文件名变化自然失效）
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 无 history 路由需求时也保留 fallback，防止刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代：前端用相对路径 /api，这里转给 WCS 后端(127.0.0.1:8085)
    # 好处：不跨域、前端不依赖服务器 IP
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
